description: |
  Espressif ESP32-P4 MIPI DSI host + bridge controller.

  The "host" register bank implements the DSI protocol engine (D-PHY control,
  low-power command generator, DPI video-mode timing generator). The "bridge"
  register bank scans a system-memory framebuffer, fed by a dedicated DW-GDMA
  channel, into the host's DPI video interface. Both banks are configured
  together by this node's driver (see mipi_dsi_hal_context_t in the vendor
  HAL, which owns both register pointers).

  The actual framebuffer + DMA engine is modeled as a separate
  "espressif,esp32-mipi-dsi-dpi" node (the zephyr,display chosen device),
  since it is a logically distinct role (owns memory + DMA) even though the
  registers live in the same hardware block.

compatible: "espressif,esp-mipi-dsi"

include: mipi-dsi-host.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true

  data-lanes:
    type: int
    required: true
    description: Number of DSI data lanes in use (1 or 2).

  lane-bit-rate-mbps:
    type: int
    required: true
    description: DSI D-PHY lane bit rate, in Mbps.

  dpi-clock-freq-mhz:
    type: int
    description: |
      Informational default DPI pixel clock in MHz. The panel child node's
      own timings and the lane-bit-rate are what the driver actually uses to
      program the horizontal/vertical timing registers.

  phy-supply:
    type: phandle
    description: |
      Regulator (LDO) that powers the DSI D-PHY. On ESP32-P4 this is one of
      the internal LDO channels (VO3), which must be configured for 2.5V.
