description: |
  Espressif ESP32-P4 MIPI DSI DPI/framebuffer scan-out engine.

  Owns a system-memory (PSRAM) framebuffer and a dedicated DW-GDMA channel
  that continuously scans it, via a single self-referencing circular
  link-list node, into the DSI bridge's push FIFO. This is the
  "zephyr,display" chosen device: it implements the Zephyr display API
  (write/blanking) used by LVGL.

  This is deliberately a separate top-level node from "espressif,esp-mipi-dsi"
  (not a child on the DSI bus): it is not a DSI peripheral, it is the video
  source that the DSI host/bridge consumes once the panel (a DSI bus child of
  the host node) attaches and switches the host into video mode.

compatible: "espressif,esp32-mipi-dsi-dpi"

include: base.yaml

properties:
  reg:
    required: true
    description: DSI bridge register bank (same physical range as the
      "bridge" reg-name entry on the sibling espressif,esp-mipi-dsi node).

  width:
    type: int
    required: true
    description: Framebuffer width in pixels.

  height:
    type: int
    required: true
    description: Framebuffer height in pixels.

  pixel-format:
    type: int
    required: true
    description: |
      Pixel format, using the MIPI_DSI_PIXFMT_* values from
      dt-bindings/mipi_dsi/mipi_dsi.h. Only MIPI_DSI_PIXFMT_RGB565 is
      currently supported by the driver.
