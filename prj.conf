# SPDX-License-Identifier: Apache-2.0
#
# club-hmi: bar-dashboard app for the Waveshare ESP32-P4-NANO 10.1"
# MIPI-DSI panel. See PLAN.md for the full design.
#
# The MIPI-DSI host and the DPI scan-out controller are the upstream Zephyr
# drivers (CONFIG_MIPI_DSI_ESP32, CONFIG_DISPLAY_ESP32_DSI). The board's
# remaining drivers/bindings (JD9365 panel, waveshare panel-ctl, GT911) use
# "default y depends on DT_HAS_<COMPAT>_ENABLED", so they turn themselves on
# automatically from the board's devicetree.

# Console / logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_MIPI_DSI_LOG_LEVEL_INF=y

# Display subsystem (the upstream MIPI-DSI host + DSI scan-out drivers enable
# themselves from the devicetree, but the DISPLAY subsystem itself needs to
# be turned on explicitly).
CONFIG_DISPLAY=y

# The display controller owns no framebuffer of its own: the app allocates a
# portrait framebuffer and scans it out directly (see src/display_rotation.c).
CONFIG_DISPLAY_ESP32_DSI_FB_NUM=0

# Input (GT911 touch -> LVGL pointer)
CONFIG_INPUT=y
CONFIG_INPUT_LOG_LEVEL_INF=y

# PSRAM: required for the DSI framebuffer (2 MB, does not fit in the
# 768 KB internal SRAM). The hpcore user SRAM is only 384 KB (the L2
# cache takes the rest), so all large buffers live in PSRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=8388608

# Code execution: the P4 runs code from flash (XIP).
CONFIG_XIP=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_DEF_REFR_PERIOD=16

# Siemens iX-inspired LVGL theme (out-of-tree module ix-lvgl).
CONFIG_LVGL_IX_THEME=y
# The VDB draw buffer lives in PSRAM (custom section); the pool stays in
# SRAM. A 4-6% VDB broke the LVGL sw-renderer (crashed in the font and
# draw-buffer paths) - keep the full 10%.
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
# CONFIG_LV_Z_MEM_POOL_SYS_HEAP is not set
CONFIG_LV_Z_MEM_POOL_HEAP_LIB_C=y
# CONFIG_LV_Z_MEM_POOL_SIZE is not set
# Only the widgets used by the dashboard UI; disabling the rest saves
# code (flash) and static data (SRAM).
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_ARCLABEL=n
CONFIG_LV_USE_CALENDAR=n
CONFIG_LV_USE_CALENDAR_HEADER_ARROW=n
CONFIG_LV_USE_CALENDAR_HEADER_DROPDOWN=n
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_CHART=n
CONFIG_LV_USE_CHECKBOX=n
CONFIG_LV_USE_DROPDOWN=n
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_LED=n
CONFIG_LV_USE_LIST=n
CONFIG_LV_USE_MENU=n
CONFIG_LV_USE_MSGBOX=n
CONFIG_LV_USE_ROLLER=n
CONFIG_LV_USE_SPINBOX=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_TABLE=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_48=n

# Networking: 10/100M Ethernet (onboard TLK110 PHY). The interface is
# brought up by the driver; the IPv4 config (DHCP or static) and hostname
# are applied at runtime by src/modules/net/net_config.c.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="bar-dashboard"
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ETH_DRIVER=y
CONFIG_ETH_ESP32=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=3
CONFIG_NET_MGMT=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_LOG=y
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=16

# NTP (SNTP)
CONFIG_SNTP=y

# Zbus — message bus for DMX commands (UI → MQTT)
CONFIG_ZBUS=y

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y

# HTTP client + TLS (Directus over HTTPS, insecure mode like the Arduino)
CONFIG_HTTP_CLIENT=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y

# JSON (config + acts parsing)
CONFIG_JSON_LIBRARY=y

# SD card (config/creds/settings files) + FATFS
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=32768

# ── Thread stack sizes (tuned for TCP + TLS + LVGL on P4) ────────────


# LVGL size cuts: RGB565 display, no 32-bit color formats
CONFIG_LV_DRAW_SW_SUPPORT_RGB888=n
CONFIG_LV_DRAW_SW_SUPPORT_XRGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888_PREMULTIPLIED=n

# Crypto cuts: only what TLS 1.2 needs (ECDHE-ECDSA + AES-GCM + SHA-256)
CONFIG_PSA_CRYPTO_ENABLE_ALL=n
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# More widget cuts: unused in the bar dashboard
CONFIG_LV_USE_SCALE=n
CONFIG_LV_USE_TILEVIEW=n
CONFIG_LV_USE_WIN=n
CONFIG_LV_USE_SPAN=n
CONFIG_LV_USE_ANIMIMG=n
CONFIG_LV_USE_IMAGEBUTTON=n
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_LINE=n
CONFIG_STACK_SENTINEL=y
CONFIG_ETH_ESP32_RX_THREAD_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_NET_ARP_TABLE_SIZE=8


# Zephyr shell — interactive serial console for debugging and control
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
